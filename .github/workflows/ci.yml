name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  verifier:
    name: Types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Contrôle de rendu (smoke)
        run: npm run smoke

      # Avertissement volontairement non bloquant tant que l'identité légale
      # n'est pas renseignée ; ce contrôle DOIT passer avant une mise en vente.
      - name: Complétude de l'identité légale (avertissement)
        run: npm run legal:check
        continue-on-error: true

      - name: Build de production
        run: npm run build

      - name: Contrôle du domaine injecté
        run: |
          test -f dist/index.html
          grep -q "https://" dist/index.html
          ! grep -q "__SITE_URL__" dist/index.html
          ! grep -q "__SITE_URL__" dist/sitemap.xml
          ! grep -q "__SITE_URL__" dist/robots.txt

  # Parcours réels dans Chromium : inscription, import CSV, sauvegarde,
  # documents légaux, routage 404. Ce job ne remplace pas le test manuel
  # multi-navigateurs, mais il prouve les interactions au lieu de les supposer.
  e2e:
    name: Parcours navigateur (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation reproductible
        run: npm ci

      - name: Installation du navigateur
        run: npx playwright install --with-deps chromium

      - name: Build de production
        run: npm run build

      - name: Tests de bout en bout
        run: npm run e2e

      - name: Détail des échecs (annotations)
        if: failure()
        run: node scripts/resumer-echecs-e2e.mjs

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

